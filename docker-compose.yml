name: riot-extractor-tap

services:
  meltano:
    image: us-central1-docker.pkg.dev/tft-data-463022/tft-data-docker-registry/tft-data-target-bigquery:latest
    container_name: meltano_riot_tap
    volumes:
      - ./meltano.yml:/project/project-config/meltano.yml
      - ./credentials.json:/project/melt-project/credentials.json
    environment:
      - TAP_RIOTAPI_AUTH_TOKEN=RGAPI-5746da5a-8d61-4fb6-b8d7-f8ba84c738f0
      - TARGET_BIGQUERY_PROJECT=tft-data-463022
      - TARGET_BIGQUERY_DATASET=match_data_landing_zone
      - TARGET_BIGQUERY_CREDENTIALS_PATH=/project/melt-project/credentials.json
      - MELTANO_ENVIRONMENT=PBE
      - MELTANO_YML_PATH=/project/project-config/meltano.yml
      - TAP_RIOTAPI_START_DATE=2025-11-21T20:30:00+00:00

