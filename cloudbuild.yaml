# Builds the extractor image and pushes it to the project's Docker registry.
#
# Run by a Cloud Build trigger on pushes to main (defined in tft_data_infra).
# The tft-data-job Cloud Run job runs :latest, so a pushed image is used from
# its next run.
#
# The build has no Riot API key, so tests/test_core.py's live API tests skip
# themselves and only the offline tests run.

substitutions:
  _REGION: us-central1
  _REGISTRY: tft-data-docker-registry
  _IMAGE: tft-data-target-bigquery

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

steps:
  - id: test
    name: python:3.11-slim
    entrypoint: sh
    args:
      - -c
      - pip install --quiet -r requirements.txt && python -m pytest

  - id: build
    name: gcr.io/cloud-builders/docker
    # The Dockerfile's COPY --chmod needs BuildKit, which isn't on by default here.
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/${_IMAGE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/${_IMAGE}:latest
      - .

# Pushed only if every step succeeds.
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/${_IMAGE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/${_IMAGE}:latest
